dataset_split:
  devign:
    dataset_version: DetectVul/devign@main
    train: hf://datasets/DetectVul/devign@main#train
    valid: hf://datasets/DetectVul/devign@main#validation
    test: hf://datasets/DetectVul/devign@main#test

  reveal:
    dataset_version: claudios/ReVeal@main
    train: hf://datasets/claudios/ReVeal@main#train
    valid: hf://datasets/claudios/ReVeal@main#validation
    test: hf://datasets/claudios/ReVeal@main#test

  bigvul:
    dataset_version: bstee615/bigvul@c0042b97d208a0338634fad28693446e830adad1
    train: hf://datasets/bstee615/bigvul@c0042b97d208a0338634fad28693446e830adad1#train
    valid: hf://datasets/bstee615/bigvul@c0042b97d208a0338634fad28693446e830adad1#validation
    test: hf://datasets/bstee615/bigvul@c0042b97d208a0338634fad28693446e830adad1#test

retrieval_pool:
  source: train
  candidate_pool_size: 50
  demonstration_policy: same_initial_top_50_candidates_for_all_methods
  keep_full_train_pool_when_running_subset: true

backbone_llm:
  model: publishers/qwen/models/qwen3-coder-480b-a35b-instruct-maas
  provider: Vertex AI

inference_config:
  temperature: 0.0
  seed: 42
  max_tokens: 256
  retry_policy: max_attempts=5; exponential_backoff=5s..120s; exhausted_request=invalid
  parser: https://github.com/HuuHieu03/GRACE/blob/main/src/evaluator.py::parse_llm_prediction

prompt_context_policy:
  graph: true
  context_limit: 8192
  truncation_policy: "target_code_max_chars=3000; standard_demo_max_chars=1500; contrastive_demo_max_chars=1200; graph_nodes_max=25; graph_edges_max=25; preserve_prefix"

evaluation_metrics:
  metrics:
    - confusion_matrix
    - precision
    - recall
    - f1
    - mcc
    - balanced_accuracy
    - predicted_positive_rate
    - invalid_rate
  trivial_baselines:
    - always_predict_vulnerable
    - always_predict_non_vulnerable

run_tracking:
  commit: git_commit_sha
  config: evaluation_contract.yaml
  target_ids: id_and_canonical_split_ids
  demonstration_ids: demonstration_id_per_target
  raw_response: llm_raw_response
  parsed_prediction: prediction_and_parse_metadata
